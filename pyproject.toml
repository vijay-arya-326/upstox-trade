[project]
name = "upstox-trade"
version = "0.1.0"
description = "CLI helper for placing and managing Upstox orders with strategy engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "python-dotenv>=1.0.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlmodel>=0.0.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0"]

[tool.uv.sources]
upstox-trade = { path = "." }