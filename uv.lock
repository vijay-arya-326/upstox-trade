version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "alembic" },
    { name = "numpy" },
    { name = "pandas" },
    { name = "pydantic" },
    { name = "python-dotenv" },
    { name = "requests" },
    { name = "rich" },
    { name = "sqlmodel" },
]

[package.optional-dependencies]
dev = [
    { name = "black" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.19.1" },
    { name = "black", marker = "extra == 'dev'", specifier = ">=24.0" },
    { name = "numpy", specifier = ">=2.5.3" },
    { name = "pandas", specifier = ">=3.0.6" },
    { name = "pydantic", specifier = ">=2.13.4" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" },
    { name = "python-dotenv", specifier = ">=1.0.0" },
    { name = "requests", specifier = ">=2.34.2" },
    { name = "rich", specifier = ">=15.0.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.5" },
    { name = "sqlmodel", specifier = ">=0.0.39" },
]
provides-extras = ["dev"]

